name: task_app
description: A comprehensive task management app with real-time collaboration, cloud sync, and advanced features.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3

  # Local storage (offline-first)
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.1

  # Firebase for cloud sync
  firebase_core: ^2.24.2
  firebase_auth: ^4.16.0
  cloud_firestore: ^4.14.0
  firebase_storage: ^11.6.0

  # UI Components
  flutter_staggered_animations: ^3.0.1
  flutter_slidable: ^3.0.1
  flutter_colorpicker: ^1.0.3
  syncfusion_flutter_calendar: ^24.1.48
  syncfusion_flutter_datepicker: ^24.1.48
  table_calendar: ^3.0.9
  intl: ^0.19.0
  flutter_localizations:
    sdk: flutter

  # Navigation
  go_router: ^13.0.1

  # Audio/Voice
  speech_to_text: ^6.1.0
  avatar_glow: ^2.0.2

  # Haptic feedback
  vibration: ^3.0.0

  # Analytics
  flutter_analytics: ^1.0.0
  charts_flutter: ^0.12.0

  # Encryption
  encrypt: ^5.0.1
  crypto: ^3.0.3

  # Network
  connectivity_plus: ^5.0.2
  dio: ^5.4.0

  # Notifications
  flutter_local_notifications: ^16.3.0
  timezone: ^0.9.2

  # Icons
  cupertino_icons: ^1.0.6
  material_design_icons_flutter: ^7.0.7296

  # AI/ML
  google_mlkit_speech_to_text: ^2.0.0

  # Theming
  dynamic_color: ^1.6.8
  flex_color_scheme: ^7.3.1

  # Utilities
  uuid: ^4.3.1
  equatable: ^2.0.5
  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1
  shared_preferences: ^2.2.2

  # Drag and drop
  reorderables: ^0.6.0

  # Rich text editor
  flutter_quill: ^8.0.0

  # Image picker
  image_picker: ^1.0.7

  # File picker
  file_picker: ^6.1.1

  # Deep links
  url_launcher: ^6.2.2

  # Biometrics
  local_auth: ^2.1.7

  # Rate limiting
  throttle: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.8
  freezed: ^2.4.6
  json_serializable: ^6.7.1
  riverpod_generator: ^2.3.9
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700

  module:
    androidX: true
